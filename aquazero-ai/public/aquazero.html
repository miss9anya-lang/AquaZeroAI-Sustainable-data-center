@media(max-width:760px){.menu{display:block}nav{display:none;width:100%;flex-direction:column}nav.open{display:flex}}
:focus-visible{outline:3px solid #e0a84a;outline-offset:2px}
main{max-width:1100px;margin:auto;padding:20px 14px 60px}
h1{font-size:clamp(26px,5vw,40px);line-height:1.2;margin:.2em 0}h2{margin-top:1.4em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.btn{background:var(--teal);color:#fff;border:0;border-radius:8px;padding:12px 18px;min-height:44px;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--teal);border:1px solid var(--teal)}.btn:disabled{opacity:.5}
.mut{color:var(--mut)}.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid}
.demo{color:var(--amb);border-color:var(--amb)}.live{color:var(--ok);border-color:var(--ok)}
.kpi{font-size:28px;font-weight:700}.kpi small{font-size:13px;font-weight:400;color:var(--mut)}
label{display:block;font-size:14px;margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;min-height:44px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>*{flex:1 1 150px}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}

function build(){const now=Date.now();S.t0=now-288*300000;S.hist=[];for(let i=0;i<288;i++)DEV.forEach((d,j)=>S.hist.push({dev:d,ts:S.t0+i*300000,...point(j,i)}));S.tick=288}
function addTick(){const now=Date.now();DEV.forEach((d,j)=>S.hist.push({dev:d,ts:now,...point(j,S.tick)}));S.tick++;if(S.hist.length>1600)S.hist.splice(0,2)}
function rows(){const since=Date.now()-S.range*3600000;return S.hist.filter(r=>r.ts>=since&&(S.dev==="all"||r.dev===S.dev))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function chart(rs,m){if(!rs.length)return`<p class="mut">${t("none")}</p>`;const W=700,H=220,p=34;
 const by={};rs.forEach(r=>(by[r.dev]=by[r.dev]||[]).push(r));const vals=rs.map(r=>r[m]);let lo=Math.min(...vals),hi=Math.max(...vals);if(hi-lo<1){hi=lo+1}
 const x=ts=>p+(ts-rs[0].ts)/Math.max(1,rs[rs.length-1].ts-rs[0].ts)*(W-p-8),y=v=>H-24-(v-lo)/(hi-lo)*(H-44);
 const col=["#287D78","#b7791f"];let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${t(m)} (${M[m][0]})"><text x="4" y="14">${M[m][0]}</text>`;
 [0,.5,1].forEach(f=>{const v=lo+(hi-lo)*f;s+=`<line x1="${p}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--bd)"/><text x="2" y="${y(v)+4}">${nf(v,0)}</text>`});
 if(m==="outlet"&&S.limit>=lo&&S.limit<=hi)s+=`<line x1="${p}" x2="${W-8}" y1="${y(S.limit)}" y2="${y(S.limit)}" stroke="var(--red)" stroke-dasharray="5 4"/>`;
 Object.keys(by).forEach((d,i)=>{s+=`<polyline fill="none" stroke="${col[i%2]}" stroke-width="2" points="${by[d].map(r=>x(r.ts)+","+y(r[m])).join(" ")}"/>`;s+=`<text x="${p+8+i*90}" y="${H-4}" style="fill:${col[i%2]}">● ${d}</text>`});
 return s+"</svg>"}
function latest(d){const a=S.hist.filter(r=>r.dev===d);return a[a.length-1]}
function recs(){const out=[];DEV.forEach(d=>{const r=latest(d);if(r.outlet>S.limit-3)out.push([d,"r1"]);else if(r.outlet>S.limit-8)out.push([d,"r2"]);else if(r.outlet<S.limit-16)out.push([d,"r4"]);else out.push([d,"r3"])});return out}
function viewHome(){return`<h1>${t("h1")}</h1><p class="mut" style="max-width:720px">${t("lead")}</p><p><button class="btn" data-go="dash">${t("cta1")}</button> <button class="btn alt" data-go="impact">${t("cta2")}</button></p>
<h2>${t("mission")}</h2><div class="card">${t("missionT")}</div>
<div class="grid" style="margin-top:14px">${["s1","s2","s3"].map(k=>`<div class="card"><b>${t(k)}</b><p class="mut">${t(k+"t")}</p></div>`).join("")}</div>`}
const viewProblem=()=>`<h1>${t("problem")}</h1><div class="grid"><div class="card"><b>${t("p1")}</b><p class="mut">${t("p1t")}</p></div><div class="card"><b>${t("p2")}</b><p class="mut">${t("p2t")}</p></div></div>`;
const viewSolution=()=>`<h1>${t("solution")}</h1><div class="grid">${["s1","s2","s3","s4"].map(k=>`<div class="card"><b>${t(k)}</b><p class="mut">${t(k+"t")}</p></div>`).join("")}</div>`;
function viewDash(){const rs=rows();const al=[];DEV.forEach(d=>{const r=latest(d);if(r.outlet>S.limit)al.push(`<div class="alert crit">${d}: ${t("outlet")} ${nf(r.outlet)} °C &gt; ${S.limit} °C</div>`)});
 const kp=(S.dev==="all"?DEV:[S.dev]).map(d=>{const r=latest(d);return`<div class="card"><b>${d}</b> <span class="badge demo">${t("sim")}</span><div class="mut" style="font-size:13px">${t("status")}: ${t("online")} · ${t("lastSeen")}: ${df(Date.now())}</div><div class="grid" style="margin-top:8px;gap:8px">${Object.keys(M).map(k=>`<div><div class="mut" style="font-size:12px">${t(k)}</div><div class="kpi">${nf(r[k])} <small>${M[k][0]}</small></div></div>`).join("")}</div></div>`}).join("");
 const last=rs.slice(-12).reverse();
 return`<h1>${t("mon")}</h1><p><span class="badge demo">DEMO</span> <span class="mut">${t("demoNote")}</span></p>
<div class="card"><div class="row"><div><label for="fr">${t("range")}</label><select id="fr">${[1,6,24].map(h=>`<option value="${h}"${h==S.range?" selected":""}>${h} h</option>`).join("")}</select></div>
<div><label for="fd">${t("dev")}</label><select id="fd"><option value="all">${t("all")}</option>${DEV.map(d=>`<option${d===S.dev?" selected":""}>${d}</option>`).join("")}</select></div>
<div><label for="fm">${t("metric")}</label><select id="fm">${Object.keys(M).map(k=>`<option value="${k}"${k===S.metric?" selected":""}>${t(k)} (${M[k][0]})</option>`).join("")}</select></div>
<div><label for="fl">${t("limit")}</label><input id="fl" type="number" min="30" max="60" value="${S.limit}"></div></div>
<p><button class="btn alt" id="lv">${S.live?t("pause"):t("resume")}</button> <button class="btn" id="ex">${t("export")}</button> <span class="badge ${S.live?"live":"demo"}">${S.live?"● "+t("live"):"❚❚"}</span></p></div>
<div class="grid" style="margin-top:14px">${kp}</div>
<div class="card" style="margin-top:14px">${chart(rs,S.metric)}</div>
<h2>${t("alerts")}</h2>${al.join("")||`<p class="mut">${t("noAlerts")}</p>`}
<h2>${t("recs")}</h2><div id="recs">${recs().map((r,i)=>`<div class="card" style="margin-bottom:8px"><b>${r[0]}</b>: ${t(r[1])}<div style="margin-top:8px"><button class="btn" data-a="${i}" data-v="1">${t("approve")}</button> <button class="btn alt" data-a="${i}" data-v="0">${t("reject")}</button></div></div>`).join("")}</div>
<p class="mut" style="font-size:13px">Rule-based baseline v0.1 · ${df(Date.now())}</p>
<h2>${t("audit")}</h2>${S.audit.map(a=>`<div class="alert">${df(a.ts)} · ${a.d} · ${a.v?t("approve"):t("reject")} · ${a.txt}</div>`).join("")||`<p class="mut">${t("noAudit")}</p>`}
<h2>${t("mon")}</h2><div class="card scroll"><table><tr><th>Time</th><th>${t("dev")}</th>${Object.keys(M).map(k=>`<th>${t(k)} (${M[k][0]})</th>`).join("")}</tr>${last.map(r=>`<tr><td>${df(r.ts)}</td><td>${r.dev}</td>${Object.keys(M).map(k=>`<td>${nf(r[k])}</td>`).join("")}</tr>`).join("")}</table></div>`}
function viewImpact(){const w=+S.wueIn,e=+S.wueIt,b=+S.base;const wue=w>0&&e>0?w/e:null;
 return`<h1>${t("impact")}</h1><div class="card"><h2 style="margin-top:0">${t("wue")}</h2><div class="row"><div><label for="wi">${t("wueIn")}</label><input id="wi" type="number" min="0" value="${esc(S.wueIn)}"></div><div><label for="we">${t("wueIt")}</label><input id="we" type="number" min="0" value="${esc(S.wueIt)}"></div><div><label for="wb">${t("base")} (L/kWh)</label><input id="wb" type="number" min="0" step="0.01" value="${esc(S.base)}"></div></div>
<p class="kpi" id="wo" aria-live="polite">${wue?`${t("wueOut")}: ${nf(wue,3)}`:"—"}${wue&&b>0?`<br><small>${t("imp")}: ${nf((b-wue)/b*100)} %</small>`:""}</p><p class="mut">${t("wueNote")}</p></div>`}
const viewContact=()=>`<h1>${t("contact")}</h1><form class="card" id="cf" novalidate style="max-width:560px"><label for="cn">${t("cname")}</label><input id="cn" maxlength="80"><div class="err" id="en"></div><label for="cm">${t("cmail")}</label><input id="cm" type="email" maxlength="120"><div class="err" id="em"></div><label for="cg">${t("cmsg")}</label><textarea id="cg" rows="5" maxlength="2000"></textarea><div class="err" id="eg"></div><p><button class="btn" type="submit">${t("send")}</button></p><div id="cs" role="status"></div></form>`;
function render(){document.documentElement.lang=S.lang;$("#lang").value=S.lang;$("#menuBtn").textContent=t("menu");
 $("#nav").innerHTML=tabs.map(k=>`<button data-go="${k}" aria-current="${k===S.tab}">${t(k)}</button>`).join("");
 const v={home:viewHome,problem:viewProblem,solution:viewSolution,dash:viewDash,impact:viewImpact,contact:viewContact}[S.tab];
 const a=document.activeElement&&document.activeElement.id;$("#app").innerHTML=v();if(a){const el=document.getElementById(a);if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}}}bind()}
function go(k){S.tab=k;$("#nav").classList.remove("open");$("#menuBtn").setAttribute("aria-expanded","false");render();$("#app").focus();scrollTo(0,0)}
function bind(){document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
 const on=(i,f)=>{const e=document.getElementById(i);if(e)e.onchange=()=>{f(e.value);render()}};
 on("fr",v=>S.range=+v);on("fd",v=>S.dev=v);on("fm",v=>S.metric=v);on("fl",v=>S.limit=Math.min(60,Math.max(30,+v||45)));
 const lv=$("#lv");if(lv)lv.onclick=()=>{S.live=!S.live;render()};
 const ex=$("#ex");if(ex)ex.onclick=exportCsv;
 document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const r=recs()[+b.dataset.a];S.audit.unshift({ts:Date.now(),d:r[0],v:+b.dataset.v,txt:t(r[1])});render()});
 [["wi","wueIn"],["we","wueIt"],["wb","base"]].forEach(([i,k])=>{const e=document.getElementById(i);if(e)e.oninput=()=>{S[k]=e.value;const w=+S.wueIn,x=+S.wueIt,b=+S.base,u=w>0&&x>0?w/x:null;$("#wo").innerHTML=u?`${t("wueOut")}: ${nf(u,3)}${b>0?`<br><small>${t("imp")}: ${nf((b-u)/b*100)} %</small>`:""}`:"—"}});
 const cf=$("#cf");if(cf)cf.onsubmit=submit}
async function exportCsv(){const rs=rows();if(!rs.length)return;const head="timestamp,device,mode,"+Object.keys(M).map(k=>k+"_"+M[k][0]).join(",");
 const csv=[head,...rs.map(r=>[new Date(r.ts).toISOString(),r.dev,"DEMO",...Object.keys(M).map(k=>r[k].toFixed(2))].join(","))].join("\n");
 try{const d=await claude.use("downloads");if(d){await d.save({filename:"aquazero-demo-readings.csv",data:csv});return}}catch(e){}
 const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a.download="aquazero-demo-readings.csv";a.click()}
async function submit(e){e.preventDefault();const n=$("#cn").value.trim(),m=$("#cm").value.trim(),g=$("#cg").value.trim();let bad=false;
 $("#en").textContent=n?"":(bad=true,t("req"));$("#em").textContent=!m?(bad=true,t("req")):!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)?(bad=true,t("bad")):"";$("#eg").textContent=!g?(bad=true,t("req")):g.length<10?(bad=true,t("short")):"";
 if(bad)return;const st=$("#cs");try{const r=await fetch("/api/contact",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n,email:m,message:g,lang:S.lang})});if(!r.ok)throw 0;st.innerHTML=`<p class="live badge">${t("ok")}</p>`;$("#cf").reset()}catch(x){st.innerHTML=`<p class="err">${t("fail")}</p>`}}
$("#lang").onchange=e=>{S.lang=e.target.value;try{localStorage.setItem("az_lang",S.lang)}catch(x){}render()};
$("#theme").onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");const n=cur==="dark"?"light":"dark";document.documentElement.dataset.theme=n;try{localStorage.setItem("az_theme",n)}catch(x){}};
try{const th=localStorage.getItem("az_theme");if(th)document.documentElement.dataset.theme=th}catch(e){}
$("#menuBtn").onclick=()=>{const o=$("#nav").classList.toggle("open");$("#menuBtn").setAttribute("aria-expanded",o)};
build();render();
setInterval(()=>{if(S.live&&S.tab==="dash"&&!document.activeElement.matches("input,select")){addTick();render()}},4000);
</script></body></html>
